[package]
name = "institutions"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["sqlite-bundled"]
sqlite-bundled = ["sqlx/sqlite-bundled"]
sqlite-unbundled = ["sqlx/sqlite-unbundled"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "macros", "migrate", "chrono", "sqlx-toml"] }
tokio = { version = "1.53.1", features = ["fs", "rt-multi-thread", "macros", "sync"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
