[package]
name = "market_watch"
version = "3.0.0"
edition = "2024"
default-run = "market_watch"

[features]
default = ["sqlite-bundled"]
sqlite-bundled = ["sqlx/sqlite-bundled"]
sqlite-unbundled = ["sqlx/sqlite-unbundled"]

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
strip = true
codegen-units = 1

[dependencies]
# Application and runtime
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
csv = "1.4.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

# Error handling
anyhow = "1.0.104"
thiserror = "2.0.21"

# Web
axum = { version = "0.8.9", features = ["multipart", "ws"] }
tower-http = { version = "0.6.11", features = ["compression-gzip", "compression-deflate"] }
include_dir = "0.7.4"
argon2 = "0.6.0"
rpassword = "7.5.4"

# Persistence
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "macros", "migrate", "chrono"] }

# Content
comrak = { version = "0.55.0", default-features = false }
regex = "1.13.1"
sha2 = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }

# External providers
base64 = "0.22.1"
fastrand = "2.5.0"
futures-util = "0.3.34"
prost = "0.14.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "cookies", "gzip", "json", "deflate", "stream"] }
scraper = "0.27.0"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

# Configuration and serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smol_str = { version = "0.3.6", features = ["serde"] }
toml = "1.1.6"

# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "chrono"] }
subtle = "2.6.1"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
