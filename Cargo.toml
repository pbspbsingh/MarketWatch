[package]
name = "market_watch"
version = "1.0.0"
edition = "2024"

[profile.release]
opt-level = "z"
panic = "abort"
lto = true
strip = true
codegen-units = 1

[dependencies]
# Application and runtime
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.18"

# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"

# Web
axum = { version = "0.8.9", features = ["multipart", "ws"] }
include_dir = "0.7.4"

# Persistence
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate", "chrono"] }

# Content
comrak = { version = "0.53.0", default-features = false }
regex = "1.12.0"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
webp = { version = "0.3.1", default-features = false, features = ["img"] }

# External providers
base64 = "0.22.1"
fastrand = "2.4.1"
futures-util = "0.3.32"
prost = "0.14.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "cookies", "gzip", "json", "deflate"] }
scraper = "0.27.0"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

# Configuration and serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"

# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
