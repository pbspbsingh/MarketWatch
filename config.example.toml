[server]
address = "127.0.0.1:8080"
compression = true
# Use 0.0.0.0:8080 to listen on every IPv4 interface; protect it with a firewall.

# For local no-auth mode, replace the credentials below with: mode = "none".
# Keep [server.auth]; omitting it is a configuration error.
[server.auth]
username = "marketwatch"
# Generate with `cargo run --bin hash_password` and paste the output here.
password_hash = "REPLACE_WITH_ARGON2ID_HASH"

[database]
url = "sqlite://market_watch.db?mode=rwc"

[market]
timezone = "America/Los_Angeles"
benchmark = "VTI"
market_hours = ["6:30:00", "13:00:00"]
adr_sessions = 20
average_volume_sessions = 50
market_repositioning_dates = ["2026-06-26"]

[home]
tickers = ["QQQ", "SPY", "IWM", "DIA"]

[market.sector_benchmarks]
basicmaterials = "XLB"
communicationservices = "XLC"
consumercyclical = "XLY"
consumerdefensive = "XLP"
energy = "XLE"
financial = "XLF"
healthcare = "XLV"
industrials = "XLI"
realestate = "XLRE"
technology = "XLK"
utilities = "XLU"

[providers]
connect_timeout_secs = 10
request_timeout_secs = 30
min_delay_ms = 10
max_delay_ms = 1000

[finviz]
industry_membership_filters = ["cap_smallover", "sh_avgvol_o400", "sh_price_o3"]
top_stocks_additional_filters = []
membership_fresh_days = 15

# Default source for new reports and background refreshes.
[n_factor]
default_source = "stock_titan" # "stock_titan" or "finviz"

# Institutions loads lazily. First use imports shared SEC history into a separate
# institutions.sqlite database; later views use indexed queries.
# Set SEC_USER_AGENT in the environment, or supply an application/contact below.
# [institutions]
# user_agent = "MarketWatch/3.0 you@your-domain.com"
# database_url = "sqlite://institutions.sqlite?mode=rwc"
# SEC files are downloaded into the OS temp directory and removed after import.

# Optional: refresh Assessment and N-Factor reports while user-started AI work is idle.
# Requires [ai] configuration. Leave this block commented to disable it.
# When all ai.max_concurrent_requests slots are busy, a user AI request preempts
# background AI work. User requests, including promoted background jobs, are protected.
# Preempted jobs preserve saved reports and retry after user work and the idle delay.
# [fundamentals.background]
# idle_delay_secs = 300
# refresh_days = 7
# Assessment always refetches fundamentals, reuses unchanged analysis, and schedules
# its next check from the last successful check. Failed jobs retry separately.
# Only tickers with stored industry mappings are eligible; mapped ETFs are excluded.
# process_non_watchlist = false # Process non-watchlist tickers after eligible watchlist tickers.
# Non-watchlist work has a 10-second pause plus 0–5 seconds of jitter after each feature job.
